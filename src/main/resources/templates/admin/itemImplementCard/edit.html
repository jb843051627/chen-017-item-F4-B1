<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改配置卡')"/>
</head>
<body>
<form class="layui-form" th:object="${card}">
    <div class="mainBox">
        <div class="main-container">
            <div class="layui-form-item" th:if="${card == null}">
                <div class="layui-bg-gray" style="padding:20px;text-align:center">配置卡不存在或已撤掉</div>
            </div>
            <th:block th:if="${card != null}">
                <div class="layui-form-item layui-hide">
                    <input type="hidden" name="id" th:value="*{id}">
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">配置卡号</label>
                    <div class="layui-input-block">
                        <input type="text" class="layui-input" th:value="*{billNo}" disabled>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">当前进展</label>
                    <div class="layui-input-block" style="line-height:38px">
                        <span th:if="*{status == 0}" class="layui-badge layui-bg-orange">待核对（可改要素）</span>
                        <span th:if="*{status == 1}" class="layui-badge layui-bg-blue">已核对（请先退回再改）</span>
                        <span th:if="*{status == 2}" class="layui-badge">已冻住（只读终态）</span>
                        <span class="layui-form-mid">第 <b th:text="*{nodeNo}">1</b> 版</span>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">年办件量</label>
                    <div class="layui-input-block">
                        <input type="number" step="0.01" min="0" name="qty" th:value="*{qty}"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">承诺时限</label>
                    <div class="layui-input-block">
                        <input type="number" step="0.01" min="0" name="fineAmt" th:value="*{fineAmt}"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">校验串</label>
                    <div class="layui-input-block">
                        <input type="text" class="layui-input" th:value="*{content}" disabled
                               th:placeholder="'旧卡尚未生成，推进时自动补算'">
                        <div class="layui-form-mid layui-word-aux">由版次与要素决定，不能手改；要素一改版次序进位，串随之变</div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-input-block">
                        <textarea name="remark" class="layui-textarea" th:text="*{remark}"></textarea>
                    </div>
                </div>
            </th:block>
        </div>
    </div>
    <div class="bottom" th:if="${card != null}">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="card-update">
                <i class="layui-icon layui-icon-ok"></i> 保存
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery'], function () {
        let form = layui.form, $ = layui.jquery;
        let MODULE_PATH = rootPath + "/ItemImplementCardController";

        form.on('submit(card-update)', function (data) {
            $.ajax({
                url: MODULE_PATH + '/edit',
                data: data.field,
                dataType: 'json',
                type: 'post',
                success: function (result) {
                    if (result.code == 200) {
                        layer.msg(result.msg || '保存成功', {icon: 1, time: 900}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));
                            parent.layui.table.reload("card-table");
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 2500});
                    }
                }
            });
            return false;
        });
    })
</script>
</body>
</html>
