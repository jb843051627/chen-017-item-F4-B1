<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('新建配置卡')"/>
</head>
<body>
<form class="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="layui-form-item">
                <label class="layui-form-label">承办部门</label>
                <div class="layui-input-block">
                    <select name="siteId" lay-verify="required" id="siteId">
                        <option value="">请选择在编部门底册</option>
                        <option th:each="s : ${sites}" th:value="${s.id}"
                                th:text="${s.siteName + (s.status == 1 ? '（已撤并）' : '')}"></option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">配置卡号</label>
                <div class="layui-input-block">
                    <input type="text" name="billNo" autocomplete="off"
                           placeholder="留空则按部门+日期自动发号；同部门同事项每天只许一张" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">年办件量</label>
                <div class="layui-input-block">
                    <input type="number" step="0.01" min="0" name="qty" id="qty"
                           autocomplete="off" placeholder="不填按默认 0 件/年，随后自动折监督层级" class="layui-input">
                    <div class="layui-form-mid layui-word-aux">默认 0 件/年；层级按部门阈值 300/1500/6000 自动定档</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">承诺时限</label>
                <div class="layui-input-block">
                    <input type="number" step="0.01" min="0" name="fineAmt" autocomplete="off"
                           placeholder="工作日（选填）" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" class="layui-textarea" placeholder="选填"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="card-save">
                <i class="layui-icon layui-icon-ok"></i> 提交建卡
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i> 重置
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery'], function () {
        let form = layui.form, $ = layui.jquery;
        let MODULE_PATH = rootPath + "/ItemImplementCardController";

        form.on('submit(card-save)', function (data) {
            $.ajax({
                url: MODULE_PATH + '/add',
                data: data.field,
                dataType: 'json',
                type: 'post',
                success: function (result) {
                    if (result.code == 200) {
                        layer.msg(result.msg || '建卡成功', {icon: 1, time: 900}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));
                            parent.layui.table.reload("card-table");
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 2000});
                    }
                }
            });
            return false;
        });
    })
</script>
</body>
</html>
